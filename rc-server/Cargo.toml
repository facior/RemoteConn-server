[package]
name = "rc-server"
description = "RemoteConn rendezvous (device IDs, NAT traversal) and relay server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rc-proto.workspace = true
rc-crypto.workspace = true
rc-transport.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand.workspace = true
blake3.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
argon2 = "0.5"
hmac = "0.12"
sha1 = "0.10"
rpassword = "7"
qr2term = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rc-rendezvous.workspace = true
