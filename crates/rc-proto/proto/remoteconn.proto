syntax = "proto3";

package remoteconn.v1;

// ---------------------------------------------------------------------------
// Reliable channel (QUIC streams). Every message is wrapped in an Envelope.
// ---------------------------------------------------------------------------

message Envelope {
  oneof msg {
    Hello hello = 1;
    HelloAck hello_ack = 2;
    PakeMessage pake = 3;
    PakeConfirm pake_confirm = 4;
    AuthResult auth_result = 5;
    Permissions permissions = 6;
    MonitorList monitor_list = 7;
    SelectMonitor select_monitor = 8;
    VideoConfig video_config = 9;
    KeyframeRequest keyframe_request = 10;
    CursorShape cursor_shape = 11;
    CursorPosition cursor_position = 12;
    MouseEvent mouse = 13;
    KeyEvent key = 14;
    SpecialKey special_key = 15;
    ClipboardData clipboard = 16;
    FileOp file_op = 17;
    ChatMessage chat = 18;
    AudioConfig audio_config = 19;
    NetworkStats stats = 20;
    Disconnect disconnect = 21;
    QualitySettings quality = 22;
  }
}

// Viewer's preference; the host adapts the bitrate within the preset's cap.
message QualitySettings {
  enum Preset {
    PRESET_UNSPECIFIED = 0;
    PRESET_BALANCED = 1;
    PRESET_QUALITY = 2;
    PRESET_SPEED = 3;
  }
  Preset preset = 1;
  // 0 = keep the current frame rate.
  uint32 max_fps = 2;
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_WINDOWS = 1;
  PLATFORM_MACOS = 2;
  PLATFORM_LINUX = 3;
}

// Sent by the viewer right after the Noise handshake.
message Hello {
  uint32 protocol_version = 1;
  string client_version = 2;
  Platform platform = 3;
  string device_name = 4;
  string device_id = 5;
  // Codecs the viewer can decode, in order of preference ("h264", "vp9", "av1").
  repeated string video_codecs = 6;
  // Account certificate for this device's Noise key (rc-crypto `account`),
  // empty without an account. A host that trusts the account skips the
  // password.
  bytes account_cert = 7;
}

message HelloAck {
  uint32 protocol_version = 1;
  string client_version = 2;
  Platform platform = 3;
  string device_name = 4;
  string device_id = 5;
  // True when the host has a permanent password set (unattended access).
  bool unattended = 6;
  // In the first HelloAck: the account certificate was accepted, so no
  // password exchange follows (the viewer waits for AuthResult).
  bool account_accepted = 7;
}

// SPAKE2 message; the password never leaves either peer.
//
// Two exchanges run side by side so a host can accept either its one-time
// or its permanent password: the viewer always sends two messages (same
// password), the host answers the second only when a permanent password is
// set. Each exchange tests a single password, as SPAKE2 requires.
message PakeMessage {
  bytes payload = 1;
  // Second exchange (permanent password); empty when unused.
  bytes payload_alt = 2;
}

// Key confirmation tag derived from the SPAKE2 session key.
message PakeConfirm {
  bytes tag = 1;
  // Tag of the second exchange (viewer only); empty when unused.
  bytes tag_alt = 2;
}

message AuthResult {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
    STATUS_WRONG_PASSWORD = 2;
    STATUS_REJECTED_BY_USER = 3;
    STATUS_TOO_MANY_ATTEMPTS = 4;
    STATUS_UNSUPPORTED_VERSION = 5;
  }
  Status status = 1;
  // Seconds the viewer must wait before retrying (rate limiting).
  uint32 retry_after_secs = 2;
}

// Granted by the host (accept dialog toggles); may change mid-session.
message Permissions {
  bool view_screen = 1;
  bool control_input = 2;
  bool clipboard = 3;
  bool file_transfer = 4;
  bool audio = 5;
  bool chat = 6;
}

message Monitor {
  uint32 id = 1;
  string name = 2;
  int32 x = 3;
  int32 y = 4;
  uint32 width = 5;
  uint32 height = 6;
  // DPI scale factor * 100 (e.g. 150 = 150%).
  uint32 scale_percent = 7;
  bool primary = 8;
}

message MonitorList {
  repeated Monitor monitors = 1;
}

message SelectMonitor {
  uint32 monitor_id = 1;
}

message VideoConfig {
  string codec = 1;
  uint32 monitor_id = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 fps = 5;
  uint32 bitrate_kbps = 6;
}

message KeyframeRequest {
  uint32 monitor_id = 1;
}

message CursorShape {
  uint64 cursor_id = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 hotspot_x = 4;
  uint32 hotspot_y = 5;
  // RGBA8, width * height * 4 bytes.
  bytes rgba = 6;
}

message CursorPosition {
  uint32 monitor_id = 1;
  int32 x = 2;
  int32 y = 3;
  uint64 cursor_id = 4;
  bool visible = 5;
}

message MouseEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_MOVE = 1;
    KIND_DOWN = 2;
    KIND_UP = 3;
    KIND_WHEEL = 4;
  }
  enum Button {
    BUTTON_NONE = 0;
    BUTTON_LEFT = 1;
    BUTTON_RIGHT = 2;
    BUTTON_MIDDLE = 3;
    BUTTON_BACK = 4;
    BUTTON_FORWARD = 5;
  }
  Kind kind = 1;
  Button button = 2;
  uint32 monitor_id = 3;
  // Position in monitor pixels.
  int32 x = 4;
  int32 y = 5;
  int32 wheel_dx = 6;
  int32 wheel_dy = 7;
}

message KeyEvent {
  // Physical key (USB HID usage), layout independent.
  uint32 hid_usage = 1;
  bool down = 2;
  // Text produced by the key on the viewer side, used for layout translation.
  string text = 3;
  uint32 modifiers = 4;
}

message SpecialKey {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_CTRL_ALT_DEL = 1;
    KIND_LOCK_SCREEN = 2;
    KIND_REBOOT = 3;
  }
  Kind kind = 1;
}

message ClipboardData {
  oneof content {
    string text = 1;
    bytes png = 2;
    // Files are offered by name and fetched over the file transfer stream.
    FileList files = 3;
  }
}

message FileList {
  repeated FileEntry entries = 1;
}

message FileEntry {
  string path = 1;
  uint64 size = 2;
  bool is_dir = 3;
  int64 modified_unix = 4;
}

message FileOp {
  oneof op {
    ListDir list_dir = 1;
    FileList dir_listing = 2;
    FileOffer offer = 3;
    FileAccept accept = 4;
    FileChunk chunk = 5;
    FileDone done = 6;
    FileCancel cancel = 7;
    FileError error = 8;
  }
}

message ListDir {
  string path = 1;
}

message FileOffer {
  uint64 transfer_id = 1;
  string name = 2;
  uint64 size = 3;
  // BLAKE3 of the whole file, used to verify and to resume.
  bytes blake3 = 4;
  string target_dir = 5;
}

message FileAccept {
  uint64 transfer_id = 1;
  // Byte offset already present on the receiver (resume).
  uint64 resume_offset = 2;
}

message FileChunk {
  uint64 transfer_id = 1;
  uint64 offset = 2;
  bytes data = 3;
}

message FileDone {
  uint64 transfer_id = 1;
}

message FileCancel {
  uint64 transfer_id = 1;
}

message FileError {
  uint64 transfer_id = 1;
  string message = 2;
}

message ChatMessage {
  string text = 1;
  int64 sent_unix_ms = 2;
}

message AudioConfig {
  bool enabled = 1;
  uint32 sample_rate = 2;
  uint32 channels = 3;
}

message NetworkStats {
  uint32 rtt_ms = 1;
  // Packet loss in permille.
  uint32 loss_permille = 2;
  uint32 received_kbps = 3;
  uint32 decoded_fps = 4;
}

message Disconnect {
  string reason = 1;
}

// ---------------------------------------------------------------------------
// Unreliable channel (QUIC datagrams): media only.
// ---------------------------------------------------------------------------

message Datagram {
  oneof msg {
    VideoPacket video = 1;
    AudioPacket audio = 2;
  }
}

// One fragment of an encoded video frame (frames larger than the datagram MTU
// are split into fragment_count pieces).
message VideoPacket {
  uint32 monitor_id = 1;
  uint64 frame_id = 2;
  uint32 fragment_index = 3;
  uint32 fragment_count = 4;
  bool keyframe = 5;
  uint64 capture_ts_us = 6;
  bytes data = 7;
}

message AudioPacket {
  uint64 seq = 1;
  uint64 capture_ts_us = 2;
  bytes opus = 3;
}
